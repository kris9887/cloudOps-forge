apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-forge
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloudops-forge
  template:
    metadata:
      labels:
        app: cloudops-forge
    spec:
      containers:
        - name: cloudops-forge
          image: ghcr.io/kris9887/cloudops-forge:latest
          ports:
            - containerPort: 5001
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
